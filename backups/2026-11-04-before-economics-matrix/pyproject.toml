[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-monitor"
version = "0.8.0"
description = "Public market data collector for USDT linear perpetuals"
requires-python = ">=3.12"
dependencies = ["ccxt>=4.5,<5", "aiohttp>=3.14.3,<3.15"]

[tool.setuptools.packages.find]
include = ["arbitrage*"]

[tool.setuptools.package-data]
arbitrage = ["instruments.json"]
